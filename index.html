<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.2/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="./dist/output.css">

    <title>My List-Movie</title>

</head>

<body class="flex flex-col h-dvh w-full  bg-slate-500 flex-1">

    <header class="bg-sky-950 md:flex md:flex-row  md:justify-between md:items-center md:p-2  ">

        <h2 class="font-bold text-amber-400 text-center p-2 md:ml-6 ">
            <i class="bi bi-film mr-1"></i>My List-movie
        </h2>

        <div id="input-wrapper" class="flex flex-col gap-2 box-border md:flex-row md:items-center">

            <div id="movie-name" class="flex">
                <label for="movie-name" class="font-bold text-amber-400 text-xs px-2">
                    Nome:</label>
                <input type="text" id="movie-name" name="movie-name" class="bg-white rounded-sm w-full mr-2">
            </div>

            <div id="movie-year" class="flex ">
                <label for="movie-year" class="font-bold text-amber-400  text-xs px-2">
                    Ano:</label>
                <input type="number" id="movie-year" name="movie-year" class="bg-white rounded-sm  w-full mr-2 ">
            </div>
            <div id="search-button" class="text-center p-2 ">
                <button
                    class="text-amber-400 outline-2 outline-white rounded-xl w-14 active:bg-amber-400 active:text-slate-900 md:w-10"><i
                        class="bi bi-search "></i></button>
            </div>
        </div>
    </header>
    
    <main>
        <section id="movie-list" class="items-center flex flex-col gap-2 p-2">
            <h2 class="font-bold text-amber-400 text-center">My List-Movie</h2>
        </section>

        <section id="modal-overlay" class="flex fixed top-0 left-0 w-full h-full justify-center items-center">

            <section id="modal-background" class="bg-slate-500 w-full h-full absolute z-0 opacity-30 rounded-xl "></section>

            <section id="modal-container" class="z-10 bg-slate-600 p-4 rounded-xl w-[85dvw] h-[55dvh] max-h-213">
                <div id="title-movie" class="flex justify-between">
                    <h2 class="font-bold">Titulo do Filme</h2>
                    <i class="bi bi-x-circle"></i>
                </div>
                <div id="movie-body" class=" ">
                    
                </div>
            </section>
        </section>
    </main>

</body>

</html>
